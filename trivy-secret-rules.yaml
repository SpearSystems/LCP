# Custom Trivy secret rules for the LCP repository (committed-secrets gate
# in .github/workflows/security.yml). Complements Trivy's embedded
# gitleaks-equivalent rules with patterns for the credential shapes this
# project documents: a real value pasted over a placeholder in the
# Kubernetes manifest templates fails CI. Placeholder sentinels
# (REPLACE_ME / REPLACE_WITH_* / {{template}}) and the throwaway CI
# Postgres credentials are allowed. Regexes use Go RE2 syntax.
#
# The built-in "examples" allow rule would skip every path containing
# "example" — including kubernetes/secret.example.yaml, exactly the file
# this gate must police. We disable it and re-allow known-synthetic paths
# below instead. The built-in "tests" allow rule stays active.
disable-allow-rules:
  - examples

allow-rules:
  - id: lcp-synthetic-example-payloads
    description: synthetic lead/bid fixtures under top-level examples/
    path: '^examples/'

rules:
  - id: lcp-hmac-secret-literal
    category: secret
    title: Non-placeholder HMAC secret value
    severity: CRITICAL
    keywords:
      - hmac_secret
    regex: '"hmac_secret"\s*:\s*"[^"]{8,}"'
    allow-rules:
      - id: lcp-hmac-placeholder
        description: manifest placeholder and templating sentinels
        regex: 'REPLACE_ME|replace_me|\{\{[A-Za-z0-9_.]+\}\}'

  - id: lcp-database-url-credentials
    category: secret
    title: Non-placeholder password in a Postgres connection string
    severity: CRITICAL
    keywords:
      - postgresql://
    regex: 'postgresql://[^:/@\s"]+:[^@\s"]{6,}@'
    allow-rules:
      - id: lcp-db-placeholder
        description: manifest placeholder and ephemeral CI credentials
        regex: 'REPLACE_ME|replace_me|\{\{[A-Za-z0-9_.]+\}\}|lcp_test|lcp_benchmark'

  - id: lcp-encryption-key-literal
    category: secret
    title: Non-placeholder application encryption key value
    severity: CRITICAL
    keywords:
      - ENCRYPTION_KEY
    regex: '(?i)ENCRYPTION_KEY["'' : =]{1,4}[A-Za-z0-9+/_=-]{24,}'
    allow-rules:
      - id: lcp-key-placeholder
        description: manifest placeholder and templating sentinels
        regex: 'REPLACE_WITH|replace_with|\{\{[A-Za-z0-9_.]+\}\}'
