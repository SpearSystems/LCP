name: SDK compatibility

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  schema-contract:
    name: Canonical schemas and generated models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema referencing
      - run: python tools/check_sdk_versions.py --check
      - run: python tools/check_sdk_schema_sync.py --check
      - run: python test-vectors/conformance.py

  python:
    name: Python SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema referencing httpx 'mcp>=1.28.1,<1.29'
      - run: python tools/generate_sdk_models.py --write
      - run: python -m pip install -e implementations/sdk/python
      # The MCP adapter is intentionally installed without dependencies here: its
      # published lcp-sdk dependency is satisfied by the editable SDK above.
      - run: python -m pip install --no-deps -e implementations/mcp-server
      - run: PYTHONPATH=implementations/sdk/python python -m unittest discover -s implementations/sdk/python/tests -v
      - run: python -c "from lcp_mcp_server.server import app; print('MCP adapter shared SDK wiring passed')"
      - name: Build Python package artifacts
        # Full python -m build (sdist, then wheel built from that sdist) catches
        # packaging regressions like force-include paths that only break the
        # sdist-to-wheel path, not editable installs.
        working-directory: implementations/sdk/python
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --outdir "$RUNNER_TEMP/python-dist"

  typescript:
    name: TypeScript SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: implementations/sdk/typescript
        run: npm install --ignore-scripts --no-audit --no-fund && npm test
      - name: Build npm package tarball
        working-directory: implementations/sdk/typescript
        run: npm pack --pack-destination "$RUNNER_TEMP"

  go:
    name: Go SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: implementations/sdk/go
        run: go test ./...
      - name: Build Go module
        working-directory: implementations/sdk/go
        run: go build ./...

  csharp:
    name: C# SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.x"
      - working-directory: implementations/sdk/csharp
        run: dotnet run --project tests/LcpSdk.Tests.csproj
      - name: Build NuGet package
        working-directory: implementations/sdk/csharp
        run: dotnet pack src/LcpSdk.csproj --configuration Release --output "$RUNNER_TEMP/nuget"

  java:
    name: Java SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: implementations/sdk/java
        run: mvn --batch-mode --no-transfer-progress test
      - name: Build Maven jar
        working-directory: implementations/sdk/java
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

  php:
    name: PHP SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: implementations/sdk/php
        run: composer install --no-interaction --no-progress --prefer-dist && php tests/shared_vector.php
      - name: Archive Composer package
        working-directory: implementations/sdk/php
        run: composer archive --format=zip --dir="$RUNNER_TEMP" --file=lcp-sdk

  rust:
    name: Rust SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: implementations/sdk/rust
        run: cargo test --locked
      - name: Build crates.io package
        # cargo package verifies the crate builds from only the files that will
        # be published, catching missing includes and packaging config errors.
        working-directory: implementations/sdk/rust
        run: cargo package --locked

  ruby:
    name: Ruby SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
      - run: gem install json_schemer --version 2.5.0 --no-document
      - run: ruby implementations/sdk/ruby/test/shared_vector_test.rb
      - name: Build Ruby gem
        working-directory: implementations/sdk/ruby
        run: gem build lcp_sdk.gemspec --output "$RUNNER_TEMP/lcp-sdk.gem"

  kotlin:
    name: Kotlin SDK
    needs: schema-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: implementations/sdk/kotlin
        run: gradle --no-daemon test
      - name: Build Kotlin jar
        working-directory: implementations/sdk/kotlin
        run: gradle --no-daemon jar

  swift:
    name: Swift SDK
    needs: schema-contract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: implementations/sdk/swift
        env:
          LCP_REPO_ROOT: ${{ github.workspace }}
        run: swift test
