name: Security and supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install published package dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install \
            -e implementations/sdk/python \
            -e implementations/mcp-server \
            -e 'implementations/reference-platform[production]'
      - name: Audit installed dependencies
        run: |
          # Local implementation distributions are not published PyPI artifacts;
          # Do not use --strict here: it treats intentionally skipped local
          # editables as an audit failure. Vulnerabilities still return nonzero.
          pip-audit --skip-editable

  source-sbom:
    name: Generate source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: lcp-source-sbom.cdx.json
          artifact-name: lcp-source-sbom.cdx.json

  container-scan:
    name: Build and scan reference image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build reference image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: implementations/reference-platform/Dockerfile
          tags: lcp-reference-platform:ci
          load: true
      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: lcp-reference-platform:ci
          format: cyclonedx-json
          output-file: lcp-container-sbom.cdx.json
          artifact-name: lcp-container-sbom.cdx.json
      - name: Scan image OS packages with Trivy
        # Python libraries are audited by pip-audit above. Keep this image gate
        # focused on OS packages so inherited base-image SBOM metadata cannot
        # report removed build-time Python packages as runtime vulnerabilities.
        # v0.36.0; pin the signed commit after the 2026 action-tag incident.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lcp-reference-platform:ci
          format: sarif
          output: trivy-results.sarif
          vuln-type: os
          severity: CRITICAL,HIGH
          # Unfixed upstream findings are non-actionable at this gate; operators
          # must review full scans without this filter. Fixed findings still fail.
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate full Trivy vulnerability report
        if: always()
        # Non-gating report: retain both OS and Python-library findings,
        # including unfixed findings, for vulnerability-exception review.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lcp-reference-platform:ci
          format: sarif
          output: trivy-full-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-full-report
          path: trivy-full-results.sarif
          if-no-files-found: error
          retention-days: 90
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: python
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
