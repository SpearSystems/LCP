name: Security and supply chain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  committed-secrets:
    name: Committed secrets scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Trivy
        env:
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz" \
            --output "${RUNNER_TEMP}/trivy.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/trivy.tar.gz" -C "${RUNNER_TEMP}" trivy
          chmod +x "${RUNNER_TEMP}/trivy"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/trivy" --version
      - name: Scan working tree for committed secrets
        run: |
          # Gitleaks-equivalent secret rules (embedded in the pinned binary)
          # plus the repository's trivy-secret-rules.yaml for the credential
          # shapes documented in the Kubernetes manifest templates. No
          # vulnerability DB download is needed. The scan covers the full
          # checked-out tree of every push and pull request, so placeholder
          # files like kubernetes/secret.example.yaml pass while their
          # REPLACE_ME sentinels remain intact and a real credential pasted
          # into any tracked file fails this job before merge. The rules file
          # is passed explicitly and is NOT named "trivy-secret.yaml", so it
          # does not leak into the container-scan job's default config load.
          "${RUNNER_TEMP}/trivy" fs --scanners secret --secret-config trivy-secret-rules.yaml --skip-version-check --exit-code 1 .

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install published package dependencies
        run: |
          python tools/generate_sdk_models.py --write
          python -m pip install --upgrade pip pip-audit
          python -m pip install \
            -e implementations/sdk/python \
            -e implementations/mcp-server \
            -e 'implementations/reference-platform[production]'
      - name: Audit installed dependencies
        run: |
          # Local implementation distributions are not published PyPI artifacts;
          # Do not use --strict here: it treats intentionally skipped local
          # editables as an audit failure. Vulnerabilities still return nonzero.
          pip-audit --skip-editable

  osv-scan:
    name: SDK dependency vulnerability scan (OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned osv-scanner
        env:
          OSV_SCANNER_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64" \
            --output "${RUNNER_TEMP}/osv-scanner"
          echo "${OSV_SCANNER_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/osv-scanner"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          # GITHUB_PATH only affects later steps; --version avoids the CLI
          # parsing "version" as a scan path (which exits 127).
          "${RUNNER_TEMP}/osv-scanner" --version
      - name: Scan all SDK lockfiles
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan --recursive --format json --output-file osv-results.json .
          json_status=$?
          osv-scanner scan --recursive --format sarif --output-file osv-results.sarif .
          sarif_status=$?
          set -e
          for status in "${json_status}" "${sarif_status}"; do
            if [[ "${status}" -ge 2 ]]; then
              echo "osv-scanner failed to complete the scan (exit ${status})" >&2
              exit "${status}"
            fi
          done
          echo "osv-scanner exit codes: json=${json_status} sarif=${sarif_status} (1 = vulnerabilities found; severity gate below)"
      - name: Fail on high or critical vulnerabilities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("osv-results.json")
          if not path.is_file():
              raise SystemExit("osv-results.json missing")
          data = json.loads(path.read_text())
          gate_failures = []
          advisory_only = []
          for result in data.get("results", []):
              for pkg in result.get("packages", []):
                  name = (pkg.get("package") or {}).get("name", "?")
                  version = (pkg.get("package") or {}).get("version", "?")
                  for vuln in pkg.get("vulnerabilities", []):
                      sev = ((vuln.get("database_specific") or {}).get("severity") or "UNKNOWN").upper()
                      item = f"{vuln.get('id')} {name}@{version} severity={sev}"
                      if sev in ("CRITICAL", "HIGH", "UNKNOWN"):
                          gate_failures.append(item)
                      else:
                          advisory_only.append(item)
          for item in advisory_only:
              print(f"advisory (non-gating): {item}")
          if gate_failures:
              print("High/critical (or unrated) vulnerabilities found:")
              for item in gate_failures:
                  print(f"  {item}")
              raise SystemExit(1)
          print("OSV gate passed: no high or critical vulnerabilities")
          PY
      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: osv-results.sarif

  source-sbom:
    name: Generate source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: lcp-source-sbom.cdx.json
          artifact-name: lcp-source-sbom.cdx.json

  container-scan:
    name: Build and scan reference image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build reference image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: implementations/reference-platform/Dockerfile
          tags: lcp-reference-platform:ci
          load: true
      - name: Generate container SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: lcp-reference-platform:ci
          format: cyclonedx-json
          output-file: lcp-container-sbom.cdx.json
          artifact-name: lcp-container-sbom.cdx.json
      - name: Smoke-test hardened runtime
        run: |
          docker run --rm --entrypoint python lcp-reference-platform:ci -c \
            'import cryptography, gunicorn, httpx, jsonschema, psycopg, lcp_platform; print("runtime imports OK")'
      - name: Scan image OS packages with Trivy
        # Python libraries are audited by pip-audit above. Keep this image gate
        # focused on OS packages so inherited base-image SBOM metadata cannot
        # report removed build-time Python packages as runtime vulnerabilities.
        # v0.36.0; pin the signed commit after the 2026 action-tag incident.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lcp-reference-platform:ci
          format: sarif
          output: trivy-results.sarif
          vuln-type: os
          severity: CRITICAL,HIGH
          # Unfixed upstream findings are non-actionable at this gate; operators
          # must review full scans without this filter. Fixed findings still fail.
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate full Trivy vulnerability report
        if: always()
        # Non-gating report: retain both OS and Python-library findings,
        # including unfixed findings, for vulnerability-exception review.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lcp-reference-platform:ci
          format: sarif
          output: trivy-full-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
      - name: Reconcile full Trivy report
        if: always()
        run: |
          python tools/reconcile_trivy_sarif.py \
            --sarif trivy-full-results.sarif \
            --exceptions docs/vulnerability-exceptions.json \
            --output trivy-reconciliation.md
      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-full-report
          path: |
            trivy-full-results.sarif
            trivy-reconciliation.md
          if-no-files-found: error
          retention-days: 90
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
