name: Security and supply chain

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install published package dependencies
        run: |
          python tools/generate_sdk_models.py --write
          python -m pip install --upgrade pip pip-audit
          python -m pip install \
            -e implementations/sdk/python \
            -e implementations/mcp-server \
            -e 'implementations/reference-platform[production]'
      - name: Audit installed dependencies
        run: |
          # Local implementation distributions are not published PyPI artifacts;
          # Do not use --strict here: it treats intentionally skipped local
          # editables as an audit failure. Vulnerabilities still return nonzero.
          pip-audit --skip-editable

  osv-scan:
    name: SDK dependency vulnerability scan (OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned osv-scanner
        env:
          OSV_SCANNER_SHA256: edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c
        run: |
          set -euo pipefail
          fail() {
            local status=$?
            local cmd="${BASH_COMMAND}"
            echo "::error::install step failed (${status}): ${cmd}"
            exit "${status}"
          }
          trap fail ERR
          command -v curl
          command -v sha256sum
          echo "RUNNER_TEMP=${RUNNER_TEMP:-<unset>}"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64" \
            --output "${RUNNER_TEMP}/osv-scanner"
          ls -l "${RUNNER_TEMP}/osv-scanner"
          echo "${OSV_SCANNER_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/osv-scanner"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          # GITHUB_PATH only affects later steps; invoke the binary directly here.
          "${RUNNER_TEMP}/osv-scanner" version
      - name: Scan all SDK lockfiles
        run: |
          set -euo pipefail
          set +e
          osv-scanner scan --recursive --format json --output-file osv-results.json .
          json_status=$?
          osv-scanner scan --recursive --format sarif --output-file osv-results.sarif .
          sarif_status=$?
          set -e
          for status in "${json_status}" "${sarif_status}"; do
            if [[ "${status}" -ge 2 ]]; then
              echo "osv-scanner failed to complete the scan (exit ${status})" >&2
              exit "${status}"
            fi
          done
          echo "osv-scanner exit codes: json=${json_status} sarif=${sarif_status} (1 = vulnerabilities found; severity gate below)"
      - name: Fail on high or critical vulnerabilities
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("osv-results.json")
          if not path.is_file():
              raise SystemExit("osv-results.json missing")
          data = json.loads(path.read_text())
          gate_failures = []
          advisory_only = []
          for result in data.get("results", []):
              for pkg in result.get("packages", []):
                  name = (pkg.get("package") or {}).get("name", "?")
                  version = (pkg.get("package") or {}).get("version", "?")
                  for vuln in pkg.get("vulnerabilities", []):
                      sev = ((vuln.get("database_specific") or {}).get("severity") or "UNKNOWN").upper()
                      item = f"{vuln.get('id')} {name}@{version} severity={sev}"
                      if sev in ("CRITICAL", "HIGH", "UNKNOWN"):
                          gate_failures.append(item)
                      else:
                          advisory_only.append(item)
          for item in advisory_only:
              print(f"advisory (non-gating): {item}")
          if gate_failures:
              print("High/critical (or unrated) vulnerabilities found:")
              for item in gate_failures:
                  print(f"  {item}")
              raise SystemExit(1)
          print("OSV gate passed: no high or critical vulnerabilities")
          PY
      - name: Upload OSV SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: osv-results.sarif

  source-sbom:
    name: Generate source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: lcp-source-sbom.cdx.json
          artifact-name: lcp-source-sbom.cdx.json

  container-scan:
    name: Build and scan reference image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build reference image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: implementations/reference-platform/Dockerfile
          tags: lcp-reference-platform:ci
          load: true
      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: lcp-reference-platform:ci
          format: cyclonedx-json
          output-file: lcp-container-sbom.cdx.json
          artifact-name: lcp-container-sbom.cdx.json
      - name: Smoke-test hardened runtime
        run: |
          docker run --rm --entrypoint python lcp-reference-platform:ci -c \
            'import cryptography, gunicorn, httpx, jsonschema, psycopg, lcp_platform; print("runtime imports OK")'
      - name: Scan image OS packages with Trivy
        # Python libraries are audited by pip-audit above. Keep this image gate
        # focused on OS packages so inherited base-image SBOM metadata cannot
        # report removed build-time Python packages as runtime vulnerabilities.
        # v0.36.0; pin the signed commit after the 2026 action-tag incident.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lcp-reference-platform:ci
          format: sarif
          output: trivy-results.sarif
          vuln-type: os
          severity: CRITICAL,HIGH
          # Unfixed upstream findings are non-actionable at this gate; operators
          # must review full scans without this filter. Fixed findings still fail.
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate full Trivy vulnerability report
        if: always()
        # Non-gating report: retain both OS and Python-library findings,
        # including unfixed findings, for vulnerability-exception review.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lcp-reference-platform:ci
          format: sarif
          output: trivy-full-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
      - name: Reconcile full Trivy report
        if: always()
        run: |
          python tools/reconcile_trivy_sarif.py \
            --sarif trivy-full-results.sarif \
            --exceptions docs/vulnerability-exceptions.json \
            --output trivy-reconciliation.md
      - name: Upload full Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-full-report
          path: |
            trivy-full-results.sarif
            trivy-reconciliation.md
          if-no-files-found: error
          retention-days: 90
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: python
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
