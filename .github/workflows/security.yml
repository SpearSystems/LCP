name: Security and supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install published package dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install \
            -e implementations/sdk/python \
            -e implementations/mcp-server \
            -e 'implementations/reference-platform[production]'
      - name: Audit installed dependencies
        run: pip-audit --strict

  source-sbom:
    name: Generate source SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: lcp-source-sbom.cdx.json
          artifact-name: lcp-source-sbom.cdx.json

  container-scan:
    name: Build and scan reference image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build reference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: implementations/reference-platform/Dockerfile
          tags: lcp-reference-platform:ci
          load: true
      - name: Generate container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: lcp-reference-platform:ci
          format: cyclonedx-json
          output-file: lcp-container-sbom.cdx.json
          artifact-name: lcp-container-sbom.cdx.json
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lcp-reference-platform:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "1"
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
