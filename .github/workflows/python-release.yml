name: Publish Python packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:e4842c8a99ca99339e1693e6fe5fe62c7becb31991f066f989047dfb2fbf47af
        env:
          POSTGRES_DB: lcp_test
          POSTGRES_USER: lcp_test
          POSTGRES_PASSWORD: lcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcp_test -d lcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --constraint requirements-ci.txt jsonschema referencing httpx cryptography 'psycopg[binary]'
      - name: Validate coordinated tag
        run: |
          python tools/check_sdk_versions.py --check
          test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < SDK_VERSION)"
      - name: Run conformance vectors
        run: python test-vectors/conformance.py
      - name: Run SDK tests
        run: PYTHONPATH=implementations/sdk/python python -m unittest discover -s implementations/sdk/python/tests -v
      - name: Run reference platform tests
        run: PYTHONPATH=implementations/reference-platform python -m unittest discover -s implementations/reference-platform/tests -v
      - name: Run real Postgres integration test
        env:
          LCP_TEST_POSTGRES_URL: postgresql://lcp_test:lcp_test@localhost:5432/lcp_test
        run: PYTHONPATH=implementations/reference-platform python -m unittest discover -s implementations/reference-platform/tests -p test_postgres_integration.py -v

  release-security:
    name: Release security gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit release dependencies
        run: |
          python tools/generate_sdk_models.py --write
          python -m pip install --upgrade pip pip-audit
          python -m pip install \
            -e implementations/sdk/python \
            -e implementations/mcp-server \
            -e 'implementations/reference-platform[production]'
          # Local implementation distributions are not published PyPI artifacts;
          # audit their installed dependencies while skipping those editables.
          # Do not use --strict here: it treats intentionally skipped local
          # editables as an audit failure. Vulnerabilities still return nonzero.
          pip-audit --skip-editable
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: lcp-release-source-sbom.cdx.json
          artifact-name: lcp-release-source-sbom.cdx.json
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build release reference image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: implementations/reference-platform/Dockerfile
          tags: lcp-reference-platform:release-check
          load: true
      - name: Generate release container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: lcp-reference-platform:release-check
          format: cyclonedx-json
          output-file: lcp-release-container-sbom.cdx.json
          artifact-name: lcp-release-container-sbom.cdx.json
      - name: Smoke-test hardened runtime
        run: |
          docker run --rm --entrypoint python lcp-reference-platform:release-check -c \
            'import cryptography, gunicorn, httpx, jsonschema, psycopg, lcp_platform; print("runtime imports OK")'
      - name: Scan release image OS packages with Trivy
        # Python libraries are audited by pip-audit above. Keep this image gate
        # focused on OS packages so inherited base-image SBOM metadata cannot
        # report removed build-time Python packages as runtime vulnerabilities.
        # v0.36.0; pin the signed commit after the 2026 action-tag incident.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lcp-reference-platform:release-check
          format: sarif
          output: trivy-release-results.sarif
          vuln-type: os
          severity: CRITICAL,HIGH
          # Unfixed upstream findings are non-actionable at this gate; operators
          # must review full scans without this filter. Fixed findings still fail.
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate full release Trivy vulnerability report
        if: always()
        # Non-gating report: retain both OS and Python-library findings,
        # including unfixed findings, for vulnerability-exception review.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: lcp-reference-platform:release-check
          format: sarif
          output: trivy-release-full-results.sarif
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"
      - name: Reconcile full release Trivy report
        if: always()
        run: |
          python tools/reconcile_trivy_sarif.py \
            --sarif trivy-release-full-results.sarif \
            --exceptions docs/vulnerability-exceptions.json \
            --output trivy-release-reconciliation.md
      - name: Upload full release Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-release-full-report
          path: |
            trivy-release-full-results.sarif
            trivy-release-reconciliation.md
          if-no-files-found: error
          retention-days: 90
      - name: Upload release Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-release-results.sarif

  build:
    name: Build ${{ matrix.name }}
    needs: [test, release-security]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lcp-sdk
            path: implementations/sdk/python
            environment: release
          - name: lcp-mcp-server
            path: implementations/mcp-server
            environment: release-python-mcp
          - name: lcp-reference-platform
            path: implementations/reference-platform
            environment: release-python-reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate canonical SDK schema bundle
        run: python tools/generate_sdk_models.py --write
      - name: Build package
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade build
          python -m build --outdir "$GITHUB_WORKSPACE/dist/${{ matrix.name }}"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/${{ matrix.name }}/
          # Immutable-version retry: a re-run after a partially completed
          # release must skip versions already accepted by PyPI instead of
          # failing the whole release-record job.
          skip-existing: true
