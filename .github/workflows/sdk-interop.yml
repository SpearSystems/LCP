# Cross-SDK signature-interop matrix — LEP-0002 rollout (ARB plan §3.3).
#
# All ten SDK probes sign the one fixed message in test-vectors/sdk/hmac.json
# through their own library entry points and format their own timestamp
# generator at a frozen sub-second instant. Signature identity across SDKs is
# blocking and so is the generation-shape column now that LEP-0002 is accepted
# and implemented (SPEC.md §9 pins the whole-second UTC wire form as a MUST;
# tools/sdk_interop_matrix.py exits 1 on any shape FAIL). The weekly schedule
# refresh keeps the evidence column current for post-merge drift.
name: SDK signature interop

on:
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC — weekly blocking interop matrix refresh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Same classifier as sdk.yml's `changes` job; keep the two in step.
  changes:
    name: Detect SDK-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          sdk=true
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # The pull_request checkout is the merge commit; parent 1 is the base.
            changed="$(git diff --name-only HEAD^1 HEAD)"
            sdk=false
            while IFS= read -r path; do
              case "${path}" in
                docs/*|site/*) ;;
                implementations/*|test-vectors/*) sdk=true ;;
                *.md) ;;
                *) sdk=true ;;
              esac
            done <<< "${changed}"
          fi
          echo "sdk=${sdk}" | tee -a "${GITHUB_OUTPUT}"

  probe:
    name: Interop probe (${{ matrix.sdk }})
    needs: changes
    # The probes are required checks. A job-level `if:` is evaluated before the
    # matrix expands, so a skipped matrix never reports the per-SDK names; the
    # docs-only skip is therefore per step, and the job always runs.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RUN_PROBE: ${{ needs.changes.outputs.sdk != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: python
            os: ubuntu-latest
            setup: |
              python -m pip install --disable-pip-version-check --constraint requirements-ci.txt jsonschema referencing httpx
              python -m pip install --disable-pip-version-check -e implementations/sdk/python
            probe: python implementations/sdk/python/examples-internal/interop_probe.py --vector test-vectors/sdk/hmac.json
          - sdk: typescript
            os: ubuntu-latest
            setup: |
              npm --prefix implementations/sdk/typescript ci --ignore-scripts --no-audit --no-fund
              npm --prefix implementations/sdk/typescript run build
            probe: node implementations/sdk/typescript/examples-internal/interop-probe.mjs --vector test-vectors/sdk/hmac.json
          - sdk: go
            os: ubuntu-latest
            setup: ""
            probe: go -C implementations/sdk/go run ./examples-internal/interop_probe --vector "$GITHUB_WORKSPACE/test-vectors/sdk/hmac.json"
          - sdk: java
            os: ubuntu-latest
            setup: mvn --batch-mode --no-transfer-progress -q -f implementations/sdk/java/pom.xml compile
            probe: java -cp implementations/sdk/java/target/classes implementations/sdk/java/examples-internal/InteropProbe.java --vector test-vectors/sdk/hmac.json
          - sdk: kotlin
            os: ubuntu-latest
            setup: ""
            probe: gradle -p implementations/sdk/kotlin --no-daemon -q test --tests com.spearsystems.lcp.InteropProbeTest
          - sdk: rust
            os: ubuntu-latest
            setup: ""
            probe: cargo run --quiet --manifest-path implementations/sdk/rust/Cargo.toml --example interop_probe -- --vector test-vectors/sdk/hmac.json
          - sdk: ruby
            os: ubuntu-latest
            setup: ""
            probe: ruby implementations/sdk/ruby/examples-internal/interop_probe.rb --vector test-vectors/sdk/hmac.json
          - sdk: php
            os: ubuntu-latest
            setup: ""
            probe: php implementations/sdk/php/examples-internal/interop_probe.php --vector test-vectors/sdk/hmac.json
          - sdk: swift
            os: macos-latest
            setup: ""
            # `swift test` on the runner's SwiftPM has no --package-path; cd is the
            # same invocation sdk.yml's Swift SDK job uses.
            probe: cd implementations/sdk/swift && swift test --filter InteropProbeTests
          - sdk: csharp
            os: ubuntu-latest
            setup: ""
            probe: dotnet run --project implementations/sdk/csharp/examples-internal/InteropProbe -- --vector test-vectors/sdk/hmac.json
    steps:
      - name: Report docs-only skip
        if: ${{ env.RUN_PROBE != 'true' }}
        run: echo "Docs-only pull request; the ${{ matrix.sdk }} probe is skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.RUN_PROBE == 'true' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ env.RUN_PROBE == 'true' }}
        with:
          python-version: "3.12"
          # setup-python fails its post step when the pip cache directory was
          # never created, so only the probe that installs packages caches.
          cache: ${{ matrix.sdk == 'python' && 'pip' || '' }}
          cache-dependency-path: |
            requirements-ci.txt
            implementations/sdk/python/pyproject.toml
      - name: Set up .NET
        if: ${{ env.RUN_PROBE == 'true' && matrix.sdk == 'csharp' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "8.x"
      - name: Cache NuGet packages
        if: ${{ env.RUN_PROBE == 'true' && matrix.sdk == 'csharp' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('implementations/sdk/csharp/**/*.csproj') }}
      - name: Set up Java
        if: ${{ env.RUN_PROBE == 'true' && matrix.sdk == 'java' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: implementations/sdk/java/pom.xml
      - name: Set up Gradle
        if: ${{ env.RUN_PROBE == 'true' && matrix.sdk == 'kotlin' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.9.1"
          cache-provider: basic
      - name: Cache Cargo
        if: ${{ env.RUN_PROBE == 'true' && matrix.sdk == 'rust' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            implementations/sdk/rust/target/
          key: cargo-interop-${{ runner.os }}-${{ hashFiles('implementations/sdk/rust/Cargo.lock') }}
          restore-keys: cargo-interop-${{ runner.os }}-
      - name: Set up toolchain
        if: ${{ env.RUN_PROBE == 'true' && matrix.setup != '' }}
        run: ${{ matrix.setup }}
      - name: Run probe
        if: ${{ env.RUN_PROBE == 'true' }}
        # LCP_INTEROP_OUT is the machine-readable channel every probe supports;
        # the stdout line is the same payload for human log readers.
        env:
          LCP_INTEROP_OUT: ${{ runner.temp }}/raw.json
          LCP_REPO_ROOT: ${{ github.workspace }}
        run: ${{ matrix.probe }}
      - name: Validate and normalize probe output
        if: ${{ env.RUN_PROBE == 'true' }}
        shell: bash
        run: |
          cat "$RUNNER_TEMP/raw.json" | python tools/sdk_interop_matrix.py extract \
            --sdk "${{ matrix.sdk }}" --out "probe-${{ matrix.sdk }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ env.RUN_PROBE == 'true' }}
        with:
          name: probe-${{ matrix.sdk }}
          path: probe-${{ matrix.sdk }}.json
          retention-days: 7

  matrix:
    name: Signature identity + generation-shape matrix
    needs: [changes, probe]
    if: ${{ needs.changes.outputs.sdk != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: probe-*
          path: probes
          merge-multiple: true
      - name: Build interop matrix
        # Exit contract (tools/sdk_interop_matrix.py): 2 = probe missing or
        # malformed, 1 = signature identity broken OR generation-shape FAIL
        # (SPEC.md §9 canonical MUST), 0 = all-ten green. Post-LEP-0002
        # implementation the shape column is blocking: any SDK that emits a
        # fractional/offset/unmarked form reddens this job.
        run: |
          python tools/sdk_interop_matrix.py aggregate \
            --vector test-vectors/sdk/hmac.json \
            --probes probes \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report interop-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: interop-report
          path: interop-report.json
          retention-days: 30
