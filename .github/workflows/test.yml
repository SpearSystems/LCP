name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Conformance, SDK, platform, and Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:e4842c8a99ca99339e1693e6fe5fe62c7becb31991f066f989047dfb2fbf47af
        env:
          POSTGRES_DB: lcp_test
          POSTGRES_USER: lcp_test
          POSTGRES_PASSWORD: lcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lcp_test -d lcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install jsonschema referencing httpx cryptography 'psycopg[binary]'
      - name: Run conformance vectors
        run: python test-vectors/conformance.py --verbose
      - name: Run SDK tests
        run: PYTHONPATH=implementations/sdk/python python -m unittest discover -s implementations/sdk/python/tests -v
      - name: Run reference platform tests and Postgres integration
        env:
          LCP_TEST_POSTGRES_URL: postgresql://lcp_test:lcp_test@localhost:5432/lcp_test
        run: PYTHONPATH=implementations/reference-platform python -m unittest discover -s implementations/reference-platform/tests -v

  tooling:
    name: Supply-chain tooling and Kyverno fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
      - uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
      - name: Install and verify Kyverno CLI
        env:
          KYVERNO_VERSION: v1.18.2
          KYVERNO_ARCHIVE: kyverno-cli_v1.18.2_linux_x86_64.tar.gz
          KYVERNO_ARCHIVE_SHA256: cb2feb8356149fd2fe774c894ccf0969f4a60a83867dd913af724f74ffbbc18b
        run: |
          set -euo pipefail
          base_url="https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}"
          curl --fail --silent --show-error --location --retry 3 \
            "${base_url}/${KYVERNO_ARCHIVE}" --output "${KYVERNO_ARCHIVE}"
          curl --fail --silent --show-error --location --retry 3 \
            "${base_url}/${KYVERNO_ARCHIVE}.sigstore.json" --output "${KYVERNO_ARCHIVE}.sigstore.json"
          echo "${KYVERNO_ARCHIVE_SHA256}  ${KYVERNO_ARCHIVE}" | sha256sum --check --strict
          cosign verify-blob \
            --bundle "${KYVERNO_ARCHIVE}.sigstore.json" \
            --certificate-identity "https://github.com/kyverno/kyverno/.github/workflows/release.yaml@refs/tags/${KYVERNO_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${KYVERNO_ARCHIVE}"
          mkdir -p "${HOME}/.kyverno"
          tar -xzf "${KYVERNO_ARCHIVE}" kyverno
          install -m 0755 kyverno "${HOME}/.kyverno/kyverno"
          echo "${HOME}/.kyverno" >> "${GITHUB_PATH}"
          "${HOME}/.kyverno/kyverno" version
      - name: Test reviewed SARIF tooling
        run: python -m unittest discover -s tools/tests -v
      - name: Test image verification fixtures
        run: kyverno test implementations/reference-platform/kubernetes/tests/verify-images --registry --detailed-results
