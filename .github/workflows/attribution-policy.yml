name: Attribution policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  attribution:
    name: Attribution policy
    runs-on: ubuntu-latest
    steps:
      # pull_request_target executes this workflow from the base branch. Do not
      # check out or execute pull-request code in this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch pull-request head without executing it
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/lcp/pr-head"

      - name: Report commit-message normalization
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event_name == 'pull_request_target' && 'refs/remotes/lcp/pr-head' || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${BASE_SHA}" =~ ^0+$ ]]; then
            echo "No previous commit is available; the attribution report will apply to subsequent pushes."
            exit 0
          fi
          # The tracked commit-msg hook strips generated attribution before a
          # normal commit is created. CI reports commits made without the hook,
          # but deliberately never rewrites PR, fork, or protected-branch history.
          python tools/check_commit_attribution.py \
            --config .github/attribution-policy.json \
            --base "${BASE_SHA}" \
            --head "${HEAD_REF}"
