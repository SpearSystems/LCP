name: Negative vectors

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-negative-vectors:
    name: Python SDK negative security vectors + conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --constraint requirements-ci.txt jsonschema referencing httpx
      - name: Run conformance vectors
        run: python test-vectors/conformance.py --verbose
      - name: Run negative security vectors (format lint + outcome assertions)
        run: PYTHONPATH=implementations/sdk/python python -m unittest discover -s implementations/sdk/python/tests -p 'test_negative_vectors.py' -v
