name: Publish SDKs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to configured registries (otherwise only the normal tag workflow should be used)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    name: Verify coordinated release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: release
        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          python tools/check_sdk_versions.py --check
          python tools/check_sdk_schema_sync.py --check
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match SDK_VERSION $version" >&2
            exit 1
          fi
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$REQUESTED_PUBLISH" = true ]; then publish=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  source-sbom:
    name: Generate source SBOM
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: lcp-sdk-source-sbom.cdx.json
          artifact-name: lcp-sdk-source-sbom.cdx.json

  npm:
    name: Publish TypeScript SDK to npm
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: python3 tools/generate_sdk_models.py --write
      - name: Check npm publication
        id: npm-existing
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          if curl --fail --silent --show-error --head --location \
            "https://registry.npmjs.org/@spear-systems%2flcp-sdk/${version}" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@spear-systems/lcp-sdk@${version} already exists; skipping immutable publication."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - working-directory: implementations/sdk/typescript
        if: steps.npm-existing.outputs.published != 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm publish --provenance --access public

  nuget:
    name: Publish .NET SDK to NuGet
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.x
      - run: python3 tools/generate_sdk_models.py --write
      - working-directory: implementations/sdk/csharp
        run: dotnet pack src/LcpSdk.csproj --configuration Release --output "$GITHUB_WORKSPACE/artifacts/nuget"
      # NUGET_USER is the nuget.org profile requesting the short-lived key;
      # the LcpSdk package and trusted-publishing policy are owned by the
      # NuGet organization SpearSystems.
      - name: NuGet trusted login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push NuGet package
        run: dotnet nuget push artifacts/nuget/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  maven-java:
    name: Publish Java SDK to Maven Central
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - run: python3 tools/generate_sdk_models.py --write
      - name: Check Java publication
        id: java-existing
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          if curl --fail --silent --show-error --location --output /dev/null \
            "https://repo1.maven.org/maven2/systems/spear/lcp-sdk/${version}/lcp-sdk-${version}.pom"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "systems.spear:lcp-sdk:${version} already exists; skipping immutable publication."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Central Portal credentials
        if: steps.java-existing.outputs.published != 'true'
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings><servers><server><id>central</id><username>${CENTRAL_USERNAME}</username><password>${CENTRAL_PASSWORD}</password></server></servers></settings>
          EOF
      - name: Import release signing key
        if: steps.java-existing.outputs.published != 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - working-directory: implementations/sdk/java
        if: steps.java-existing.outputs.published != 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" deploy

  maven-kotlin:
    name: Publish Kotlin SDK to Maven Central
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - run: python3 tools/generate_sdk_models.py --write
      - name: Check Kotlin publication
        id: kotlin-existing
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          if curl --fail --silent --show-error --location --output /dev/null \
            "https://repo1.maven.org/maven2/systems/spear/lcp-sdk-kotlin/${version}/lcp-sdk-kotlin-${version}.pom"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "systems.spear:lcp-sdk-kotlin:${version} already exists; skipping immutable publication."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - working-directory: implementations/sdk/kotlin
        if: steps.kotlin-existing.outputs.published != 'true'
        env:
          MAVEN_REPOSITORY_URL: ${{ secrets.MAVEN_REPOSITORY_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: gradle --no-daemon publish
      # Gradle's built-in maven-publish plugin uploads file-by-file to the
      # Portal OSSRH compatibility API. Submit that same-IP repository to the
      # Central Publisher Portal so it is validated and automatically released.
      - name: Submit Kotlin deployment to Central Portal
        if: steps.kotlin-existing.outputs.published != 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          auth="$(printf '%s:%s' "$MAVEN_USERNAME" "$MAVEN_PASSWORD" | base64 | tr -d '\n')"
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            --request POST \
            --header "Authorization: Bearer $auth" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/systems.spear?publishing_type=automatic"


  crates:
    name: Publish Rust SDK to crates.io
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/generate_sdk_models.py --write
      - name: Check crates.io publication
        id: crates-existing
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          index_file="$(mktemp)"
          trap 'rm -f "$index_file"' EXIT
          curl --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            --output "$index_file" \
            "https://index.crates.io/lc/p-/lcp-sdk" || {
              echo "Unable to determine whether lcp-sdk@${version} exists on the crates.io index; refusing to publish." >&2
              exit 1
            }
          result="$(python3 - "$version" "$index_file" <<'PY'
          import json
          import sys

          version, index_path = sys.argv[1:]
          with open(index_path, encoding="utf-8") as index:
              versions = [json.loads(line)["vers"] for line in index if line.strip()]
          print("published" if version in versions else "unpublished")
          PY
          )" || {
            echo "Unable to parse the crates.io index; refusing to publish." >&2
            exit 1
          }
          case "$result" in
            published)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "lcp-sdk@${version} already exists; skipping immutable publication."
              ;;
            unpublished)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io index result $result; refusing to publish." >&2
              exit 1
              ;;
          esac
      - name: crates.io trusted login
        id: crates-auth
        if: steps.crates-existing.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - working-directory: implementations/sdk/rust
        if: steps.crates-existing.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked

  rubygems:
    name: Publish Ruby SDK to RubyGems
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check RubyGems publication
        id: rubygems-existing
        run: |
          version="$(tr -d '[:space:]' < SDK_VERSION)"
          if curl --fail --silent --show-error --location \
            "https://rubygems.org/api/v2/rubygems/lcp-sdk/versions/${version}.json" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "lcp-sdk@${version} already exists; skipping immutable publication."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        if: steps.rubygems-existing.outputs.published != 'true'
        with:
          ruby-version: ruby
          working-directory: implementations/sdk/ruby
          bundler-cache: true
      - run: python3 tools/generate_sdk_models.py --write
        if: steps.rubygems-existing.outputs.published != 'true'
      - uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
        if: steps.rubygems-existing.outputs.published != 'true'
        with:
          working-directory: implementations/sdk/ruby

  indexed-registries:
    name: Verify tag-indexed SDKs
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 tools/generate_sdk_models.py --write
          python3 tools/check_sdk_versions.py --check
          composer validate --no-check-publish implementations/sdk/php/composer.json
          (cd implementations/sdk/go && go test ./...)
          go env GOPROXY
      - name: Explain tag-indexed publication
        run: |
          echo "PHP is mirrored by Packagist from the signed tag."
          echo "Go is indexed by proxy.golang.org from the signed tag."
          echo "Swift Package Manager consumes the signed repository tag."
