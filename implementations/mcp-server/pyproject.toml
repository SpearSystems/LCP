[project]
name = "lcp-mcp-server"
version = "1.0.0"
description = "LCP (Lead Context Protocol) MCP server — thin adapter wrapping LCP REST endpoints as agent tools."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28.1,<2.1.0",
    "lcp-sdk>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "referencing>=0.35.0",
]

[project.scripts]
lcp-mcp-server = "lcp_mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcp_mcp_server"]