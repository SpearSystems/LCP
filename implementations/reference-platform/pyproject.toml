[project]
name = "lcp-reference-platform"
version = "1.0.0"
description = "Production-oriented reference platform and router for LCP Lead Context Protocol deployments."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "referencing>=0.35.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
object-storage = ["boto3>=1.35.0", "clamd>=1.0.2"]
production = ["gunicorn>=23.0", "psycopg[binary]>=3.2", "boto3>=1.35.0", "clamd>=1.0.2"]

[project.scripts]
lcp-platform = "lcp_platform.server:main"
lcp-platform-admin = "lcp_platform.admin:main"
lcp-platform-worker = "lcp_platform.worker:main"

[project.urls]
Documentation = "https://github.com/SpearSystems/LCP"
Source = "https://github.com/SpearSystems/LCP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcp_platform"]
