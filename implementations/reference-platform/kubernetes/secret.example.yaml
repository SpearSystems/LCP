apiVersion: v1
kind: Secret
metadata:
  name: lcp-platform-secrets
type: Opaque
stringData:
  # Replace with a TLS-enabled Postgres connection and private application role.
  LCP_DATABASE_URL: postgresql://lcp_app:REPLACE_ME@postgres.internal:5432/lcp?sslmode=verify-full
  # URL-safe base64 for a random 32-byte AES-GCM application encryption key.
  LCP_PII_ENCRYPTION_KEY: REPLACE_WITH_URLSAFE_BASE64_32_BYTE_KEY
  # JSON object; mount this value as /run/secrets/lcp/credentials.json.
  LCP_CREDENTIALS_JSON: '{"publisher_001":{"tenant_id":"publisher_tenant","hmac_secret":"REPLACE_ME","scopes":["lead:submit","lead:read"]},"buyer_001":{"tenant_id":"buyer_tenant","hmac_secret":"REPLACE_ME","scopes":["bid:submit","lead:read"]}}'
