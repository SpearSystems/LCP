apiVersion: v1
kind: ConfigMap
metadata:
  name: lcp-platform-config
data:
  LCP_SCHEMA_DIR: /app/schemas
  LCP_REQUIRE_AUTH: "true"
  LCP_ALLOW_INSECURE_WEBHOOKS: "false"
  LCP_PLATFORM_ID: platform_001
  LCP_ROUTING_TENANT_ID: default
  LCP_REPLAY_WINDOW_SECONDS: "300"
  LCP_MAX_BODY_BYTES: "2000000"
  LCP_MAX_HEADER_BYTES: "16384"
  LCP_MAX_WEBHOOK_RESPONSE_BYTES: "262144"
  LCP_RATE_LIMIT_PER_MINUTE: "600"
  LCP_WEBHOOK_TIMEOUT_SECONDS: "10"
  LCP_MAX_DELIVERY_ATTEMPTS: "5"
  LCP_WORKER_INTERVAL_SECONDS: "1"
