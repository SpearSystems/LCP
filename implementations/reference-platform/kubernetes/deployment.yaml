apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcp-platform-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lcp-platform-api
  template:
    metadata:
      labels:
        app: lcp-platform-api
    spec:
      serviceAccountName: lcp-platform
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/replace-me/lcp-reference-platform@sha256:REPLACE_WITH_SIGNED_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "--bind", "0.0.0.0:8080", "--workers", "3", "--threads", "4", "--access-logfile", "-", "lcp_platform.wsgi:application"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: lcp-platform-config
          env:
            - name: LCP_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lcp-platform-secrets
                  key: LCP_DATABASE_URL
            - name: LCP_PII_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lcp-platform-secrets
                  key: LCP_PII_ENCRYPTION_KEY
            - name: LCP_SECRETS_FILE
              value: /run/secrets/lcp/credentials.json
          volumeMounts:
            - name: lcp-credentials
              mountPath: /run/secrets/lcp
              readOnly: true
            - name: lcp-attachments
              mountPath: /var/lib/lcp/attachments
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: lcp-credentials
          secret:
            secretName: lcp-platform-secrets
            defaultMode: 0440
            items:
              - key: LCP_CREDENTIALS_JSON
                path: credentials.json
        - name: lcp-attachments
          persistentVolumeClaim:
            claimName: lcp-attachments
---
