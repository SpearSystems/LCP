apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: lcp-fixture-provenance-policy
spec:
  background: false
  rules:
    - name: require-lcp-workflow-provenance
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - ghcr.io/kyverno/test-verify-image:signed-by-someone-else
          type: SigstoreBundle
          required: true
          verifyDigest: true
          attestations:
            - predicateType: https://slsa.dev/provenance/v1
              attestors:
                - count: 1
                  entries:
                    - keyless:
                        subject: https://github.com/SpearSystems/LCP/.github/workflows/container-release.yml@refs/tags/v*
                        issuer: https://token.actions.githubusercontent.com
                        rekor:
                          url: https://rekor.sigstore.dev
