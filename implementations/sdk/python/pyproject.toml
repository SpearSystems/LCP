[project]
name = "lcp-sdk"
version = "1.0.2"
description = "LCP (Lead Context Protocol) SDK for validation, signing, and HTTP integrations."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "referencing>=0.35.0",
]

[project.urls]
Documentation = "https://github.com/SpearSystems/LCP"
Source = "https://github.com/SpearSystems/LCP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcp_sdk"]

# The canonical schemas are committed inside the package as lcp_sdk/schemas/
# and lcp_sdk/verticals/ (generated by tools/generate_sdk_models.py), so the
# wheel and sdist ship them automatically via packages = ["lcp_sdk"] without
# build-time ../ paths that break sdist-to-wheel builds.
