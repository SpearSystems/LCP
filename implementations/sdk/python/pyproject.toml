[project]
name = "lcp-sdk"
version = "0.1.0"
description = "LCP (Lead Context Protocol) SDK for validation, signing, and HTTP integrations."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "referencing>=0.35.0",
]

[project.urls]
Documentation = "https://github.com/SpearSystems/LCP"
Source = "https://github.com/SpearSystems/LCP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lcp_sdk"]

# Bundle the canonical repository schemas in released SDK wheels.
[tool.hatch.build.targets.wheel.force-include]
"../../../schemas" = "lcp_sdk/schemas"
"../../../verticals" = "lcp_sdk/verticals"
"lcp_sdk/schema-bundle.json" = "lcp_sdk/schema-bundle.json"
