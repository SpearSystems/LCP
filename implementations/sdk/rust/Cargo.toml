[package]
name = "lcp-sdk"
version = "0.1.0"
edition = "2021"
description = "LCP Lead Context Protocol SDK for Rust"
license = "Apache-2.0"

[dependencies]
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
urlencoding = "2"
getrandom = "0.4"
hex = "0.4"
jsonschema = "0.37"

[lib]
name = "lcp_sdk"
path = "src/lib.rs"
