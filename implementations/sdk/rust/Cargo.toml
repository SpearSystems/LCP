[package]
name = "lcp-sdk"
version = "1.0.2"
edition = "2021"
description = "LCP Lead Context Protocol SDK for Rust"
homepage = "https://spear.systems"
repository = "https://github.com/SpearSystems/LCP"
documentation = "https://docs.rs/lcp-sdk"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
hmac = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
time = { version = "0.3", features = ["parsing", "formatting"] }
urlencoding = "2"
getrandom = "0.4"
hex = "0.4"
jsonschema = "0.49"

[lib]
name = "lcp_sdk"
path = "src/lib.rs"
